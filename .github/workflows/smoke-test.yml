name: Smoke test (emulator)

# Desktop-verifiable launch check for a patched Samsung Health APK:
# download → patch with the released bundle (morphe-desktop CLI) → static
# verify (verify_patched.py) → install and launch on an arm64 emulator →
# assert the process stays alive → capture screenshot + logcat.
#
# Catches the VerifyError / stub-corruption failure class BEFORE a device
# flash. It does NOT validate Knox 0x1 behavior, Samsung Account login, or
# sync — those stay on the physical-device gate.
#
# Health ships arm-only ABIs, so this needs an arm64 runner (macos-15) with
# an arm64-v8a system image — no x86 translation involved.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Samsung Health version (APKPure)"
        required: true
        default: "7.00.6.011"
      bundle_tag:
        description: "Release tag to pull the patch bundle from (empty = latest)"
        required: false
        default: ""

permissions:
  contents: read

env:
  PACKAGE: com.sec.android.app.shealth

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        run: |
          brew install apkeep
          # macos-15 Python is PEP 668 externally-managed — venv + PATH so the
          # static-verify step's `python3` resolves to it
          python3 -m venv "$PWD/.venv"
          "$PWD/.venv/bin/pip" install --quiet androguard
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH applies to later steps only — check with the venv python
          "$PWD/.venv/bin/python3" -c "import androguard; print('androguard OK')"

      - name: Download Samsung Health APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          apkeep -a "$PACKAGE@$VERSION" -d apk-pure "$PWD"
          ls -lh "$PACKAGE@$VERSION.apk"

      - name: Download patch bundle + patcher
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_TAG: ${{ inputs.bundle_tag }}
        run: |
          if [[ -n "$BUNDLE_TAG" ]]; then
            gh release download "$BUNDLE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'patches-*.mpp' --dir "$PWD"
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'patches-*.mpp' --dir "$PWD"
          fi
          gh release download --repo MorpheApp/morphe-desktop --pattern 'morphe-desktop-*-all.jar' --clobber --dir "$PWD"
          ls -lh patches-*.mpp morphe-desktop-*-all.jar

      - name: Patch APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MARKER=$(mktemp)
          java -jar morphe-desktop-*-all.jar patch -p patches-*.mpp "$PACKAGE@$VERSION.apk" | tail -5
          PATCHED="$(find . -maxdepth 2 -name '*.apk' ! -name "$PACKAGE@$VERSION.apk" -newer "$MARKER" | head -1)"
          rm -f "$MARKER"
          [[ -n "$PATCHED" ]] || { echo "FATAL: patcher produced no output"; exit 1; }
          echo "PATCHED=$PATCHED" >> "$GITHUB_ENV"
          ls -lh "$PATCHED"

      - name: Static verify (stubs landed)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/verify_patched.py \
            --original "$PACKAGE@$VERSION.apk" \
            --patched "$PATCHED"

      - name: Emulator launch test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PATCHED: ${{ env.PATCHED }}
        with:
          api-level: 34
          arch: arm64-v8a
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            adb install -r "$PATCHED"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 45
            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            echo "pid=$PID"
            adb exec-out screencap -p > smoke-screenshot.png
            adb logcat -d > smoke-logcat.txt
            if [[ -z "$PID" ]]; then
              echo "::error::Patched app did not stay running (no pid) — check smoke-logcat.txt"
              exit 1
            fi
            grep -iE "VerifyError|FATAL EXCEPTION" smoke-logcat.txt && { echo "::error::Crash signature in logcat"; exit 1; } || true
            echo "Smoke test OK — process $PID alive after launch"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-${{ inputs.version }}
          path: |
            smoke-screenshot.png
            smoke-logcat.txt
          if-no-files-found: ignore
