name: Smoke test (emulator)

# Desktop-verifiable launch check for a patched Samsung Health APK:
# download → patch with the released bundle (morphe-desktop CLI) → static
# verify (verify_patched.py) → install and launch on an emulator → assert
# the process stays alive → capture screenshot + logcat.
#
# Catches the VerifyError / stub-corruption failure class BEFORE a device
# flash. It does NOT validate Knox 0x1 behavior, Samsung Account login, or
# sync — those stay on the physical-device gate.
#
# Runner choice: ubuntu-latest + KVM (hosted macOS runners block nested HVF
# for the arm64 emulator — "HVF error: HV_UNSUPPORTED" on macos-14/15).
# Health ships arm-only ABIs, so the x86_64 system image runs it through
# the image's built-in ARM translation (libndk, google_apis API 30+).
# Slower than native — boot + install + first-launch take minutes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Samsung Health version (APKPure)"
        required: true
        default: "7.00.6.011"
      bundle_tag:
        description: "Release tag to pull the patch bundle from (empty = latest)"
        required: false
        default: ""

permissions:
  contents: read

env:
  PACKAGE: com.sec.android.app.shealth

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        run: |
          URL="$(curl -sL https://api.github.com/repos/EFForg/apkeep/releases/latest \
            | jq -r '.assets[] | select(.name == "apkeep-x86_64-unknown-linux-gnu") | .browser_download_url')"
          sudo curl -sL -o /usr/local/bin/apkeep "$URL"
          sudo chmod +x /usr/local/bin/apkeep
          apkeep --help >/dev/null
          # Ubuntu 24.04 Python is PEP 668 externally-managed — venv + PATH so
          # the static-verify step's `python3` resolves to it
          python3 -m venv "$PWD/.venv"
          "$PWD/.venv/bin/pip" install --quiet androguard
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH applies to later steps only — check with the venv python
          "$PWD/.venv/bin/python3" -c "import androguard; print('androguard OK')"

      - name: Download Samsung Health APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # acknowledge_dangers: informed consent for apk-pure as the source
          # (see EFForg/apkeep USAGE-apkpure.md) — this repo patches APKs of
          # apps the user owns for interoperability
          apkeep -a "$PACKAGE@$VERSION" -d apk-pure -o 'acknowledge_dangers=true' "$PWD"
          ls -lh "$PACKAGE@$VERSION.apk"

      - name: Download patch bundle + patcher
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_TAG: ${{ inputs.bundle_tag }}
        run: |
          if [[ -n "$BUNDLE_TAG" ]]; then
            gh release download "$BUNDLE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'patches-*.mpp' --dir "$PWD"
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'patches-*.mpp' --dir "$PWD"
          fi
          gh release download --repo MorpheApp/morphe-desktop --pattern 'morphe-desktop-*-all.jar' --clobber --dir "$PWD"
          ls -lh patches-*.mpp morphe-desktop-*-all.jar

      - name: Patch APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MARKER=$(mktemp)
          java -jar morphe-desktop-*-all.jar patch -p patches-*.mpp "$PACKAGE@$VERSION.apk" | tail -5
          PATCHED="$(find . -maxdepth 2 -name '*.apk' ! -name "$PACKAGE@$VERSION.apk" -newer "$MARKER" | head -1)"
          rm -f "$MARKER"
          [[ -n "$PATCHED" ]] || { echo "FATAL: patcher produced no output"; exit 1; }
          echo "PATCHED=$PATCHED" >> "$GITHUB_ENV"
          ls -lh "$PATCHED"

      - name: Static verify (stubs landed)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/verify_patched.py \
            --original "$PACKAGE@$VERSION.apk" \
            --patched "$PATCHED"

      # ubuntu-latest ships /dev/kvm but the runner user lacks group access —
      # without this the emulator-runner falls back to TCG (-accel off) and
      # API 34 boot exceeds its timeout. Standard workaround from
      # ReactiveCircus/android-emulator-runner discussions.
      - name: Enable KVM for runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Emulator launch test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PATCHED: ${{ env.PATCHED }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -memory 3072 -no-snapshot
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r "$PATCHED"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sh scripts/emulator_smoke_check.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-${{ inputs.version }}
          path: |
            smoke-screenshot.png
            smoke-logcat.txt
          if-no-files-found: ignore
